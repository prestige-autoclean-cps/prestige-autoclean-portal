<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Prestige Auto Clean</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira:ital,wght@1,800;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="nav-container"></div>

  <div class="page-shell">
    <h1 class="page-title">Dashboard</h1>
    <div class="card">
      <p id="greeting">Loading your profile...</p>
      <p>This is still a placeholder dashboard. Phase 2 added the Customers
         and Packages pages above — the real schedule, stat cards and job
         list come in Phase 3.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/util.js"></script>
  <script>
    (async () => {
      const profile = await requireStaffSession();
      if (!profile) return; // requireStaffSession already redirected to login

      document.getElementById("nav-container").innerHTML = renderNav(profile, "dashboard");
      wireNavLogout();

      const greeting = document.getElementById("greeting");
      greeting.innerHTML =
        `Signed in as <strong>${escapeHtml(profile.name || "(no name set)")}</strong>` +
        `<span class="role-badge">${escapeHtml(profile.role)}</span>`;
    })();
  </script>
</body>
</html>
